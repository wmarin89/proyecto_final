<header class="main-header" id="main-header">

    <!-- Logo -->
    <a class="brand-logo" href="/index.html"
       aria-label="Reporte Ciudadano - Inicio">

        <svg class="brand-icon"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 100 106"
             fill="none"
             aria-hidden="true">
            <path d="M50 6 C70 6 86 13 90 17 C90 50 83 75 69 90 C58 100 50 104 50 104 C50 104 42 100 31 90 C17 75 10 50 10 17 C14 13 30 6 50 6 Z"
                  fill="#ffffff"/>
            <path d="M50 24 C60 24 68 32 68 42 C68 55 50 72 50 72 C50 72 32 55 32 42 C32 32 40 24 50 24 Z"
                  fill="var(--primary-color)"/>
            <circle cx="50" cy="41" r="5.5" fill="#ffffff"/>
            <path d="M41 81 L48 88 L60 74"
                  fill="none"
                  stroke="var(--primary-color)"
                  stroke-width="5"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>

        <div class="brand-text">
            <span class="brand-title">Reporte Ciudadano</span>
            <span class="brand-subtitle">Municipio Activo</span>
        </div>
    </a>

    <!-- Menú principal -->
    <nav class="main-nav" id="main-nav"
         aria-label="Navegación principal">
        <ul class="nav-list">
            <li class="nav-item nav-item-home">
                <a class="nav-link" id="nav-home-link"
                   href="/index.html">Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="nav-reports-link"
                   href="/my-reports.html">Reportes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="nav-contact-link"
                   href="/contact.html">Contacto</a>
            </li>
        </ul>
    </nav>

    <!-- Accesos del usuario -->
    <div class="user-menu" id="user-menu">

        <div class="user-action-item" id="notifications-menu-item">
            <a class="action-link notification-link"
               id="notification-btn"
               href="/notifications.html"
               aria-label="Ver notificaciones">
                <svg class="action-icon"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 48 48"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="3"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M24 4c-5.5 0-10 4.5-10 10v10c0 4-2 7-5 9h30c-3-2-5-5-5-9V14c0-5.5-4.5-10-10-10z"/>
                    <path d="M18 37a6 6 0 0 0 12 0"/>
                </svg>
                <span class="action-label">Notificaciones</span>
            </a>
        </div>

        <div class="user-action-item" id="profile-menu-item">
            <a class="action-link profile-link"
               id="profile-btn"
               href="/profile.html"
               aria-label="Ver perfil de usuario">
                <svg class="action-icon"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 48 48"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="3"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="24" cy="16" r="8"/>
                    <path d="M10 40c0-6 6-10 14-10s14 4 14 10"/>
                </svg>
                <span class="action-label">Perfil</span>
            </a>
        </div>

    </div>
</header>
